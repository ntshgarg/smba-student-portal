name: Encrypted production backup

on:
  # The nightly schedule is off. This job's only destination was
  # actions/upload-artifact, and on a public repository that means any GitHub
  # account can download the snapshot -- which held children's names, dates of
  # birth and guardian phone numbers, plus password hashes and plaintext TOTP
  # secrets. Fifteen snapshots were live and have been deleted.
  #
  # Do not re-enable the schedule until the final "Refuse to publish the
  # snapshot" step is replaced by an upload to storage where a read is
  # authenticated, logged and revocable. Until then this workflow fails on
  # purpose after creating the snapshot, so no run reads as a successful backup.
  workflow_dispatch:

concurrency:
  group: encrypted-production-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    name: Create and verify encrypted snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out trusted default-branch backup code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Create logical snapshot
        env:
          SMBA_DATABASE_SNAPSHOT_SOURCE: ${{ secrets.SMBA_BACKUP_DATABASE_URL }}
          SMBA_DATABASE_SNAPSHOT_TOKEN: ${{ secrets.SMBA_BACKUP_DATABASE_TOKEN }}
        run: |
          test -n "$SMBA_DATABASE_SNAPSHOT_SOURCE" || { echo "SMBA_BACKUP_DATABASE_URL is missing."; exit 1; }
          test -n "$SMBA_DATABASE_SNAPSHOT_TOKEN" || { echo "SMBA_BACKUP_DATABASE_TOKEN is missing."; exit 1; }
          mkdir -p .data/backup-run
          npm run db:snapshot:create -- .data/backup-run/smba-production.db

      - name: Verify logical snapshot
        run: |
          npm run db:snapshot:verify -- .data/backup-run/smba-production.db

      - name: Encrypt snapshot and manifest
        env:
          SMBA_BACKUP_PASSPHRASE: ${{ secrets.SMBA_BACKUP_PASSPHRASE }}
        run: |
          test "${#SMBA_BACKUP_PASSPHRASE}" -ge 24 || { echo "SMBA_BACKUP_PASSPHRASE must contain at least 24 characters."; exit 1; }
          tar -C .data/backup-run -czf .data/smba-production-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz \
            smba-production.db smba-production.db.manifest.json
          printf '%s' "$SMBA_BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --s2k-digest-algo SHA512 \
            --output .data/smba-production-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz.gpg \
            .data/smba-production-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz

      - name: Remove plaintext copies
        if: always()
        run: |
          rm -f .data/smba-production-${{ github.run_id }}-${{ github.run_attempt }}.tar.gz
          rm -rf .data/backup-run

      # There is deliberately nowhere to put the file yet. It was kept with
      # actions/upload-artifact, which on a public repository is readable by any
      # GitHub account; see the note at the top of this file. Replace this step
      # with an upload to private, access-controlled, logged storage (for example
      # an object-storage bucket written with a write-only key) and delete the
      # failure below. Until then a run that reached here has produced a snapshot
      # that is about to be thrown away, and says so instead of reporting success.
      - name: Refuse to publish the snapshot
        run: |
          echo "::error::No private storage is configured for backups. The encrypted snapshot was not saved anywhere."
          exit 1
