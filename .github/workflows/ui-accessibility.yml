name: UI accessibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ui-accessibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  accessibility:
    name: UI accessibility / WCAG 2.2 AA
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BETTER_AUTH_SECRET: smba-accessibility-ci-secret-never-used-in-production-2026
      NEXT_PUBLIC_SMBA_SITE_ORIGIN: https://ci.smbaacademy.in
      SMBA_ACCESSIBILITY_ADMIN_PASSWORD: SMBA accessibility admin 2026!
      SMBA_ACCESSIBILITY_PIN: "246810"
      SMBA_AUTH_MAIL_TRANSPORT: memory
      SMBA_FIXTURE_PASSWORD: SMBA fixture access 2026!
      SMBA_FAILURE_EVIDENCE_ROOT: output/failure-evidence/accessibility
      SMBA_INITIAL_ADMIN_NAME: Accessibility Platform Owner
      SMBA_INITIAL_ADMIN_PASSWORD: SMBA accessibility admin 2026!
      SMBA_INITIAL_ADMIN_PIN: "574482"
      SMBA_REQUIRE_RECOVERY_EMAIL: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build immutable accessibility sources under /tmp
        env:
          NODE_OPTIONS: --conditions=react-server
          NODE_PATH: ./node_modules/next/dist/compiled
        run: |
          mkdir -p /tmp/smba-accessibility-sources
          npx tsx scripts/regression/fixture.ts prepare-source \
            --source /tmp/smba-accessibility-sources/smba-accessibility-source.db
          npx tsx scripts/regression/fixture.ts build-clean \
            --source /tmp/smba-accessibility-sources/smba-accessibility-source.db \
            --target /tmp/smba-accessibility-sources/smba-accessibility-clean-source.db
          npx tsx scripts/regression/fixture.ts build --profile stress \
            --source /tmp/smba-accessibility-sources/smba-accessibility-source.db \
            --target /tmp/smba-accessibility-sources/smba-accessibility-stress-source.db
          DB_FILE_NAME=/tmp/smba-accessibility-sources/smba-accessibility-admin-source.db npm run db:prepare:empty
          DB_FILE_NAME=/tmp/smba-accessibility-sources/smba-accessibility-admin-source.db npm run db:provision:admin
          sha256sum \
            /tmp/smba-accessibility-sources/smba-accessibility-source.db \
            /tmp/smba-accessibility-sources/smba-accessibility-admin-source.db \
            /tmp/smba-accessibility-sources/smba-accessibility-clean-source.db \
            /tmp/smba-accessibility-sources/smba-accessibility-stress-source.db \
            > /tmp/smba-accessibility-sources.sha256

      - name: Prepare disposable accessibility databases
        run: |
          cp /tmp/smba-accessibility-sources/smba-accessibility-admin-source.db /tmp/smba-accessibility-admin.db
          cp /tmp/smba-accessibility-sources/smba-accessibility-clean-source.db /tmp/smba-accessibility-clean.db
          cp /tmp/smba-accessibility-sources/smba-accessibility-stress-source.db /tmp/smba-accessibility-stress.db
          DB_FILE_NAME=/tmp/smba-accessibility-stress.db npm run db:provision:admin

      - name: Build production application
        env:
          DB_FILE_NAME: /tmp/smba-accessibility-sources/smba-accessibility-clean-source.db
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Audit admin-only academy
        id: admin
        continue-on-error: true
        env:
          BETTER_AUTH_SECURE_COOKIES: "false"
          DB_FILE_NAME: /tmp/smba-accessibility-admin.db
          SMBA_ACCESSIBILITY_BASE_URL: http://127.0.0.1:3110
          SMBA_ACCESSIBILITY_DB: /tmp/smba-accessibility-admin.db
          SMBA_ACCESSIBILITY_PROFILE: admin
          SMBA_REQUIRE_COACH_TOTP: "true"
        run: |
          npx next start -p 3110 > /tmp/smba-accessibility-admin.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3110/api/health > /dev/null; then
              npm run regression:accessibility
              exit $?
            fi
            sleep 1
          done
          npx tsx scripts/regression/sanitize-server-log.ts /tmp/smba-accessibility-admin.log output/failure-evidence/accessibility/admin-server.sanitized.txt
          exit 1

      - name: Audit clean activation academy
        id: clean
        continue-on-error: true
        env:
          BETTER_AUTH_SECURE_COOKIES: "false"
          DB_FILE_NAME: /tmp/smba-accessibility-clean.db
          SMBA_ACCESSIBILITY_BASE_URL: http://127.0.0.1:3111
          SMBA_ACCESSIBILITY_DB: /tmp/smba-accessibility-clean.db
          SMBA_ACCESSIBILITY_PROFILE: clean
          SMBA_REQUIRE_COACH_TOTP: "true"
        run: |
          npx next start -p 3111 > /tmp/smba-accessibility-clean.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3111/api/health > /dev/null; then
              npm run regression:accessibility
              exit $?
            fi
            sleep 1
          done
          npx tsx scripts/regression/sanitize-server-log.ts /tmp/smba-accessibility-clean.log output/failure-evidence/accessibility/clean-server.sanitized.txt
          exit 1

      # Only this profile carries a fixture whose dates are frozen: the stress
      # academy is built against FIXTURE_ANCHOR_DATE, while the admin and clean
      # databases are seeded from this runner's own clock and are already
      # self-consistent. Rendering the frozen fixture against a moving clock is
      # what walked `stress · color-contrast` 1015 -> 1021 across one academy
      # midnight, in 58460e6, a commit that changed no CSS at all, because every
      # midnight promotes one more attendance cell out of the future. The instant
      # has to sit inside August 2026 for the matrix's own literals
      # (`?year=2026&month=08`, `?period=2026-08`, `?from=2026-08-01&to=2026-08-31`)
      # to keep meaning what they meant when they were written, after 2026-08-03
      # so the ledger still renders "not recorded" days, and before 2026-08-31 so
      # it still renders "not available" ones. Pinning to the anchor itself would
      # drop the first of those states out of the audit entirely.
      #
      # This block covers both `next start` and the runner below, and only the
      # first of those matters: lib/clock.ts reads the variable in the Next
      # process. That used to be true by accident. It is now checked -- the run
      # reads the server's own answer back from /api/health before it audits
      # anything -- so moving the runner out of this env, or into a step that
      # starts its own server, fails loudly instead of quietly auditing a
      # wall-clock DOM.
      - name: Audit populated stress academy
        id: stress
        continue-on-error: true
        env:
          BETTER_AUTH_SECURE_COOKIES: "false"
          DB_FILE_NAME: /tmp/smba-accessibility-stress.db
          SMBA_ACCESSIBILITY_BASE_URL: http://127.0.0.1:3112
          SMBA_ACCESSIBILITY_CLOCK: "2026-08-17T09:30:00+05:30"
          SMBA_ACCESSIBILITY_DB: /tmp/smba-accessibility-stress.db
          SMBA_ACCESSIBILITY_PROFILE: stress
          SMBA_REQUIRE_COACH_TOTP: "false"
        run: |
          npx next start -p 3112 > /tmp/smba-accessibility-stress.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3112/api/health > /dev/null; then
              npm run regression:accessibility
              exit $?
            fi
            sleep 1
          done
          npx tsx scripts/regression/sanitize-server-log.ts /tmp/smba-accessibility-stress.log output/failure-evidence/accessibility/stress-server.sanitized.txt
          exit 1

      # capture-regression.spec.ts is 189 lines and 48 cases that no workflow has
      # ever invoked: `regression:capture` exists in package.json and nothing calls
      # it. It is not a screenshot-diff suite -- `evidenceViolations` fails a case
      # on horizontal document overflow, an uncaught page error, a console error, a
      # failed request, an HTTP error response or an incomplete image, and
      # `SMBA_CAPTURE_STRICT` already defaults to true. So it has been a working
      # gate with nothing pulling the lever.
      #
      # It runs here rather than in its own workflow because it needs exactly what
      # this job has already paid for: a production build and a served stress
      # fixture. A separate port keeps it off the audit server above, whose own
      # step has already exited by this point.
      #
      # Deliberately the harness default viewport set, not SMBA_CAPTURE_VIEWPORT_SET=responsive.
      # `viewportsForCapture` (capture-matrix.ts:589-595) returns `responsiveViewports`
      # for *every* definition once that variable is set, ignoring what each capture
      # is written for -- so the six `public-home-*` captures, whose action opens the
      # mobile navigation, get run at 1440x900 where no mobile navigation exists and
      # time out waiting for it. That is a property of the harness rather than of this
      # step, and `regression:capture:responsive` carries it too; fixing it means
      # per-definition viewport handling, which is a change to the matrix and not to
      # the wiring.
      - name: Capture responsive regression evidence
        id: capture
        continue-on-error: true
        env:
          BETTER_AUTH_SECURE_COOKIES: "false"
          DB_FILE_NAME: /tmp/smba-accessibility-stress.db
          SMBA_CAPTURE_BASE_URL: http://127.0.0.1:3113
          SMBA_CAPTURE_OUTPUT_DIR: output/runtime-regression/capture
          SMBA_REQUIRE_COACH_TOTP: "false"
        run: |
          npx next start -p 3113 > /tmp/smba-capture.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3113/api/health > /dev/null; then
              npm run regression:capture
              exit $?
            fi
            sleep 1
          done
          npx tsx scripts/regression/sanitize-server-log.ts /tmp/smba-capture.log output/failure-evidence/accessibility/capture-server.sanitized.txt
          exit 1

      - name: Write accessibility job summary
        id: summary
        if: always()
        continue-on-error: true
        run: npx tsx scripts/regression/summarize-accessibility.ts --output "$GITHUB_STEP_SUMMARY"

      - name: Confirm immutable accessibility sources remain unchanged
        id: fixtures
        if: always()
        continue-on-error: true
        run: sha256sum --check /tmp/smba-accessibility-sources.sha256

      - name: Show server logs after a failure
        if: always() && (steps.admin.outcome == 'failure' || steps.clean.outcome == 'failure' || steps.stress.outcome == 'failure' || steps.capture.outcome == 'failure')
        run: |
          npx tsx scripts/regression/sanitize-server-log.ts /tmp/smba-accessibility-admin.log output/failure-evidence/accessibility/admin-server.sanitized.txt
          npx tsx scripts/regression/sanitize-server-log.ts /tmp/smba-accessibility-clean.log output/failure-evidence/accessibility/clean-server.sanitized.txt
          npx tsx scripts/regression/sanitize-server-log.ts /tmp/smba-accessibility-stress.log output/failure-evidence/accessibility/stress-server.sanitized.txt

      - name: Upload failure evidence
        if: always() && (steps.admin.outcome == 'failure' || steps.clean.outcome == 'failure' || steps.stress.outcome == 'failure' || steps.capture.outcome == 'failure' || steps.summary.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-accessibility-failure-${{ github.run_id }}-${{ github.run_attempt }}
          # Every file writeAccessibilityResults produces, not only the counts.
          # update-accessibility-advisory-baseline.ts refuses to record a profile
          # whose fixture-clock.sanitized.json is missing -- it will not invent the
          # day a set of results was rendered at -- so an artifact carrying the
          # results without the clock is an artifact nobody can record from, and the
          # only remedy left is a local fixture build, `npm run build` and Playwright
          # run. The clock file is what makes this the recovery path for the
          # re-record the pin asks for on merge:
          #   npx tsx scripts/regression/update-accessibility-advisory-baseline.ts
          #     --root <extracted>/accessibility
          # The `--root` is needed because upload-artifact roots the archive at the
          # deepest common ancestor of everything it matched, and the sanitized
          # server logs written above put that at `output/`.
          path: |
            output/failure-evidence/**/*.masked.png
            output/failure-evidence/**/*.sanitized.json
            output/failure-evidence/**/*.sanitized.txt
            output/accessibility/**/results.sanitized.json
            output/accessibility/**/summary.sanitized.txt
            output/accessibility/**/fixture-clock.sanitized.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce accessibility outcomes
        if: always()
        run: |
          test "${{ steps.admin.outcome }}" = success
          test "${{ steps.clean.outcome }}" = success
          test "${{ steps.stress.outcome }}" = success
          test "${{ steps.capture.outcome }}" = success
          test "${{ steps.summary.outcome }}" = success
          test "${{ steps.fixtures.outcome }}" = success
