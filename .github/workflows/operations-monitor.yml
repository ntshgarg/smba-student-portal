name: Operations monitor

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: operations-monitor
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  backup-freshness:
    name: Backup and restore freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted freshness helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Require a recent encrypted backup and restore verification
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const checkFreshness = require("./.github/scripts/check-backup-freshness.js")
            const result = await checkFreshness({
              defaultBranch: context.payload.repository.default_branch,
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            core.notice(`Backup run ${result.backupRunId}, restore run ${result.restoreRunId}, artifact ${result.artifactId} are current.`)

  security-signals:
    name: Authentication delivery and lockout signals
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check production security signals without exposing accounts
        env:
          SMBA_MONITOR_DATABASE_URL: ${{ secrets.SMBA_BACKUP_DATABASE_URL }}
          SMBA_MONITOR_DATABASE_TOKEN: ${{ secrets.SMBA_BACKUP_DATABASE_TOKEN }}
          SMBA_MONITOR_APPLICATION_ERROR_THRESHOLD: "1"
          SMBA_MONITOR_EMAIL_FAILURE_THRESHOLD: "1"
          SMBA_MONITOR_LOCKOUT_THRESHOLD: "3"
          SMBA_MONITOR_LOOKBACK_MINUTES: "60"
        run: npm run ops:security-signals
