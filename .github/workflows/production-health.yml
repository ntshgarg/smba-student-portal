name: Production health

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: production-health
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Public availability and database probe
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify production without signing in or changing data
        run: node scripts/operations/check-production.mjs https://smbaacademy.in --attempts 3 --delay-ms 5000
