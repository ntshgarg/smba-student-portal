name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BETTER_AUTH_SECRET: smba-ci-only-secret-never-used-in-production-2026
  NEXT_PUBLIC_SMBA_SITE_ORIGIN: https://ci.smbaacademy.in
  SMBA_AUTH_MAIL_TRANSPORT: memory
  SMBA_REQUIRE_COACH_TOTP: "true"
  SMBA_REQUIRE_RECOVERY_EMAIL: "false"

jobs:
  static:
    name: Static validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Validate migrations
        run: npm run db:check

  unit:
    name: Unit and operational tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run bounded unit and operational tests
        run: npm run test:ci

      - name: Run fixture lifecycle regression in isolation
        run: npm run regression:test

  browser:
    name: Build and browser regression
    runs-on: ubuntu-24.04
    # 45 covered four suites against three workspaces. The two added below run
    # 14 further cases single-worker, most of them reloading a route once per
    # viewport across four or five widths, so the headroom goes with them; a job
    # that runs out of clock is a red merge check that says nothing about the code.
    timeout-minutes: 60
    env:
      SMBA_FAILURE_EVIDENCE_ROOT: output/failure-evidence/browser
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build and verify every regression database
        run: |
          npm run fixture:build:all
          npm run fixture:verify:all

      - name: Build production application
        env:
          DB_FILE_NAME: .data/academy-clean.db
        run: npm run build

      - name: Install Chromium for browser regressions
        run: npx playwright install --with-deps chromium

      - name: Prove masked failure evidence is safe
        env:
          SMBA_FAILURE_EVIDENCE_ROOT: output/failure-evidence-sentinel
          SMBA_FAILURE_EVIDENCE_SENTINEL: "true"
          SMBA_FAILURE_EVIDENCE_SENTINEL_EMAIL: clumsy.thumbs@example.test
          SMBA_FAILURE_EVIDENCE_SENTINEL_SECRET: SMBA-sentinel-password-246810
        run: |
          if npx playwright test -c tests/e2e/playwright.failure-evidence.config.ts; then
            echo "The failure-evidence sentinel was expected to fail."
            exit 1
          fi
          node scripts/regression/verify-failure-evidence.mjs output/failure-evidence-sentinel --clean

      - name: Prepare disposable registration database
        run: cp .data/academy-clean.db /tmp/smba-ci-registration.db

      - name: Start isolated registration workspace
        env:
          BETTER_AUTH_SECURE_COOKIES: "false"
          DB_FILE_NAME: /tmp/smba-ci-registration.db
          SMBA_REQUIRE_COACH_TOTP: "false"
        run: |
          npx next start -p 3101 > /tmp/smba-ci-registration-server.log 2>&1 &
          echo $! > /tmp/smba-ci-registration-server.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3101/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          npx tsx scripts/regression/sanitize-server-log.ts \
            /tmp/smba-ci-registration-server.log \
            output/failure-evidence/browser/registration-server.sanitized.txt
          exit 1

      - name: Run registration and activation E2E
        env:
          SMBA_REGISTRATION_RESILIENCE_BASE_URL: http://127.0.0.1:3101
          SMBA_REGISTRATION_RESILIENCE_DB: /tmp/smba-ci-registration.db
        run: npm run regression:registration

      - name: Show registration server log after a failure
        if: failure()
        run: npx tsx scripts/regression/sanitize-server-log.ts /tmp/smba-ci-registration-server.log output/failure-evidence/browser/registration-server.sanitized.txt

      - name: Stop isolated registration workspace
        if: always()
        run: |
          if test -f /tmp/smba-ci-registration-server.pid; then
            kill "$(cat /tmp/smba-ci-registration-server.pid)" 2>/dev/null || true
          fi

      - name: Prepare disposable finance database
        env:
          SMBA_FINANCE_DB: /tmp/smba-ci-finance-${{ github.run_id }}-${{ github.run_attempt }}.db
        run: npm run regression:finance:prepare -- .data/academy-clean.db "$SMBA_FINANCE_DB"

      - name: Start isolated finance workspace
        env:
          BETTER_AUTH_SECURE_COOKIES: "false"
          DB_FILE_NAME: /tmp/smba-ci-finance-${{ github.run_id }}-${{ github.run_attempt }}.db
          SMBA_REQUIRE_COACH_TOTP: "false"
        run: |
          npx next start -p 3102 > /tmp/smba-ci-finance-server.log 2>&1 &
          echo $! > /tmp/smba-ci-finance-server.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3102/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          npx tsx scripts/regression/sanitize-server-log.ts \
            /tmp/smba-ci-finance-server.log \
            output/failure-evidence/browser/finance-server.sanitized.txt
          exit 1

      - name: Run coach-to-player finance E2E
        env:
          SMBA_FINANCE_BASE_URL: http://127.0.0.1:3102
          SMBA_FINANCE_DB: /tmp/smba-ci-finance-${{ github.run_id }}-${{ github.run_attempt }}.db
        run: npm run regression:finance

      - name: Show finance server log after a failure
        if: failure()
        run: npx tsx scripts/regression/sanitize-server-log.ts /tmp/smba-ci-finance-server.log output/failure-evidence/browser/finance-server.sanitized.txt

      - name: Stop isolated finance workspace and remove its database
        if: always()
        env:
          SMBA_FINANCE_DB: /tmp/smba-ci-finance-${{ github.run_id }}-${{ github.run_attempt }}.db
        run: |
          if test -f /tmp/smba-ci-finance-server.pid; then
            kill "$(cat /tmp/smba-ci-finance-server.pid)" 2>/dev/null || true
          fi
          rm -f "$SMBA_FINANCE_DB" "$SMBA_FINANCE_DB-shm" "$SMBA_FINANCE_DB-wal"

      - name: Prepare disposable stress database
        run: cp .data/academy-stress.db /tmp/smba-ci-stress.db

      - name: Start isolated stress workspace
        env:
          BETTER_AUTH_SECURE_COOKIES: "false"
          DB_FILE_NAME: /tmp/smba-ci-stress.db
          SMBA_REQUIRE_COACH_TOTP: "false"
        run: |
          npx next start -p 3000 > /tmp/smba-ci-stress-server.log 2>&1 &
          echo $! > /tmp/smba-ci-stress-server.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          npx tsx scripts/regression/sanitize-server-log.ts \
            /tmp/smba-ci-stress-server.log \
            output/failure-evidence/browser/stress-server.sanitized.txt
          exit 1

      - name: Run responsive authentication E2E
        run: npm run regression:authentication

      - name: Run academy onboarding E2E
        env:
          SMBA_ONBOARDING_BASE_URL: http://127.0.0.1:3000
        run: npm run regression:onboarding

      - name: Run attendance operations E2E
        env:
          SMBA_ATTENDANCE_WORKSPACES_BASE_URL: http://127.0.0.1:3000
        run: npm run regression:attendance

      - name: Run responsive overflow and interface correctness E2E
        env:
          SMBA_RESPONSIVE_OVERFLOW_BASE_URL: http://127.0.0.1:3000
        run: npm run regression:responsive-overflow

      # Last against this workspace because of what it publishes, not because it
      # is the only writer here: attendance-workspaces.spec.ts, two steps up,
      # commits two saves against the 2026-07-31 player register and has a third
      # rejected as stale. phase8-followup.spec.ts adds an announcement, and the
      # dashboard and the archive the responsive suite measures would see that
      # arrive underneath them, so it has to run after that suite. The order it inherits
      # is not free: its 379,350-byte budget reads
      # /coach/attendance/players/register?year=2026, which renders those
      # 2026-07-31 rows, so an overrun here can mean the earlier saves changed
      # the register rather than that a route grew. Read the attendance step
      # before blaming the diff. The disposable database is named so the config
      # can refuse to run against anything but a clone.
      - name: Run phase 8 follow-up E2E
        env:
          SMBA_PHASE8_BASE_URL: http://127.0.0.1:3000
          SMBA_PHASE8_DISPOSABLE_DB: /tmp/smba-ci-stress.db
        run: npm run regression:phase8-followup

      - name: Show stress server log after a failure
        if: failure()
        run: npx tsx scripts/regression/sanitize-server-log.ts /tmp/smba-ci-stress-server.log output/failure-evidence/browser/stress-server.sanitized.txt

      - name: Stop isolated stress workspace
        if: always()
        run: |
          if test -f /tmp/smba-ci-stress-server.pid; then
            kill "$(cat /tmp/smba-ci-stress-server.pid)" 2>/dev/null || true
          fi

      - name: Confirm canonical fixtures remain unchanged
        run: npm run fixture:verify:all

      - name: Upload sanitized browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/failure-evidence/**/*.masked.png
            output/failure-evidence/**/*.sanitized.json
            output/failure-evidence/**/*.sanitized.txt
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: Application regression
    if: ${{ always() }}
    needs: [static, unit, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every isolated regression job
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$BROWSER_RESULT" = success
