name: UI Bug & Enhancement Review

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write # Allows the workflow to post UI bug findings directly to the PR

jobs:
  visual-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Start Local Server
      run: |
        npm run build
        npm run start &
        npx wait-on http://localhost:3000

    - name: Run Visual Regression Tests
      id: playwright-tests
      run: npx playwright test --update-snapshots
      # NOTE: In a mature pipeline, omit "--update-snapshots" and compare against 
      # an established baseline directory.

    - name: Upload Visual Diffs on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
