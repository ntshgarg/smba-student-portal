name: Empty the academy

# Handover: leave the production database holding the platform owner and nothing
# else, so the incoming head coach starts at the one-time secure setup instead of
# meeting somebody else's authenticator.
#
# It exists as a workflow rather than a local command because the production
# database credentials already live here as secrets. Running it needs a button
# and a typed confirmation, not a terminal with production tokens in it.
#
# It cannot fire by itself. workflow_dispatch is the only trigger, `confirm` has
# no default, and the reset refuses unless that value names the owner it is
# about to keep.
#
# Every value that reaches a shell here arrives through `env:` and is read as a
# quoted shell variable. Nothing is spliced in with ${{ }}: an expression is
# substituted into the script *before* bash parses it, so a dispatch input
# pasted that way is source code running beside the production write token, not
# an argument to a command. That is the shape the `no interpolation in a
# secret-bearing run: block` assertion in tests/ci-security-controls.test.ts
# exists to keep out.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the platform owner Academy ID to confirm (SMBA-ADMIN-0001)'
        required: true
        type: string
      backup_confirmed:
        description: 'I have a current backup of the production database in private, access-controlled storage'
        required: true
        type: boolean

concurrency:
  group: empty-academy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  empty:
    name: Empty the production academy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require a backup made elsewhere
        env:
          BACKUP_CONFIRMED: ${{ inputs.backup_confirmed }}
        run: |
          if [ "$BACKUP_CONFIRMED" != "true" ]; then
            echo "::error::Tick 'backup_confirmed'. This workflow keeps no copy of the database itself: it relies on the nightly backup in the private backup store, which the next step checks."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checks the tick box: a stored backup under 30 hours old must exist.
      - name: Require a backup from the last 30 hours
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STORE_REPOSITORY: ${{ vars.SMBA_BACKUP_STORE_REPOSITORY || format('{0}/smba-backups', github.repository_owner) }}
          STORE_TOKEN_SET: ${{ secrets.SMBA_BACKUP_STORE_TOKEN != '' }}
        with:
          github-token: ${{ secrets.SMBA_BACKUP_STORE_TOKEN || github.token }}
          script: |
            const backupStore = require("./.github/scripts/backup-store.js")
            try {
              backupStore.requireStoreToken(process.env.STORE_TOKEN_SET === "true")
              const store = backupStore.parseStoreRepository(process.env.STORE_REPOSITORY)
              await backupStore.assertPrivateStore({
                github,
                publicRepository: `${context.repo.owner}/${context.repo.repo}`,
                store,
              })
              const newest = backupStore.newestCompleteBackup(
                await backupStore.listStoredBackups({ github, store }),
              )
              const ageHours = backupStore.requireRecentBackup(newest, new Date())
              core.notice(`Newest stored backup: ${newest.name}, made ${ageHours} hours ago.`)
            } catch (error) {
              await core.summary
                .addHeading("Nothing was deleted", 3)
                .addRaw(error.message)
                .write()
              core.setFailed(error.message)
            }

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Proves the production database is reachable and readable before anything
      # is deleted. It is NOT a backup: the snapshot lives on this runner and goes
      # with it. It used to be encrypted and kept with actions/upload-artifact, but
      # the repository is public and any GitHub account can download a public
      # repository's artifacts, so that put a copy of every child's record in
      # front of anyone who wanted it, protected only by one passphrase. The
      # `backup_confirmed` input above makes a person say, before this runs, that a
      # copy already exists somewhere access-controlled, and "Require a backup
      # from the last 30 hours" checks the private backup store for it.
      - name: Check the database can be read first
        env:
          SMBA_DATABASE_SNAPSHOT_SOURCE: ${{ secrets.SMBA_BACKUP_DATABASE_URL }}
          SMBA_DATABASE_SNAPSHOT_TOKEN: ${{ secrets.SMBA_BACKUP_DATABASE_TOKEN }}
        run: |
          test -n "$SMBA_DATABASE_SNAPSHOT_SOURCE" || { echo "SMBA_BACKUP_DATABASE_URL is missing."; exit 1; }
          test -n "$SMBA_DATABASE_SNAPSHOT_TOKEN" || { echo "SMBA_BACKUP_DATABASE_TOKEN is missing."; exit 1; }
          mkdir -p .data/pre-reset
          npm run db:snapshot:create -- .data/pre-reset/smba-production.db
          npm run db:snapshot:verify -- .data/pre-reset/smba-production.db

      # The backup token is deliberately read-only, and the reset needs to write.
      # Checked before the first attempt so the failure names the missing secret
      # rather than surfacing as libsql's "SQL write operations are forbidden"
      # from inside a pragma.
      - name: Require write credentials
        env:
          SMBA_ADMIN_DATABASE_TOKEN: ${{ secrets.SMBA_ADMIN_DATABASE_TOKEN }}
          SMBA_ADMIN_DATABASE_URL: ${{ secrets.SMBA_ADMIN_DATABASE_URL }}
        run: |
          missing=0
          test -n "$SMBA_ADMIN_DATABASE_URL" || { echo "SMBA_ADMIN_DATABASE_URL is missing."; missing=1; }
          test -n "$SMBA_ADMIN_DATABASE_TOKEN" || { echo "SMBA_ADMIN_DATABASE_TOKEN is missing."; missing=1; }
          if [ "$missing" = "1" ]; then
            {
              echo "### Write credentials missing"
              echo
              echo "The nightly backup secrets are read-only, so they cannot empty anything."
              echo "Add the production database credentials as two repository secrets:"
              echo
              echo "- \`SMBA_ADMIN_DATABASE_URL\` — the same value as Vercel's \`TURSO_DATABASE_URL\`"
              echo "- \`SMBA_ADMIN_DATABASE_TOKEN\` — a Turso token **with write access**"
              echo
              echo "Nothing was deleted. This workflow keeps no copy of the database."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Read-only in effect. Prints what the reset would remove, so the log
      # carries the before picture even when the run that follows succeeds.
      #
      # SMBA_CONFIRM_REMOTE_RESET is the script's opt-in for touching a remote
      # academy at all, so every step that runs it needs it -- the guard is on
      # the Turso credentials being present, not on the deletion, because the
      # credentials are what makes a mistake here unrecoverable.
      - name: Report what will be removed
        env:
          SMBA_CONFIRM_REMOTE_RESET: "1"
          SMBA_USE_TURSO: "true"
          TURSO_AUTH_TOKEN: ${{ secrets.SMBA_ADMIN_DATABASE_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.SMBA_ADMIN_DATABASE_URL }}
        run: npm run db:reset:academy

      # --confirm-target names the database out loud, because --confirm can only
      # name PLATFORM_ADMIN_ACADEMY_ID and that constant is identical on every
      # database the script can reach. Here it comes from the same secret that
      # selects the target, which is a tautology on purpose: the URL is a
      # repository secret and must not be retyped into a dispatch input, where
      # it would be readable in the run's parameters. The typed confirmation
      # this workflow asks a human for is `confirm`; the value below only keeps
      # the local guard satisfiable from CI.
      - name: Empty the academy
        env:
          CONFIRM_ACADEMY_ID: ${{ inputs.confirm }}
          SMBA_CONFIRM_REMOTE_RESET: "1"
          SMBA_USE_TURSO: "true"
          TURSO_AUTH_TOKEN: ${{ secrets.SMBA_ADMIN_DATABASE_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.SMBA_ADMIN_DATABASE_URL }}
        run: |
          npm run db:reset:academy -- \
            --confirm "$CONFIRM_ACADEMY_ID" \
            --confirm-target "$TURSO_DATABASE_URL"

      - name: Confirm the academy is empty
        env:
          SMBA_CONFIRM_REMOTE_RESET: "1"
          SMBA_USE_TURSO: "true"
          TURSO_AUTH_TOKEN: ${{ secrets.SMBA_ADMIN_DATABASE_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.SMBA_ADMIN_DATABASE_URL }}
        # `--verify` asks whether the academy is empty, not whether anything was
        # deleted. The site stays live throughout, so by the time this runs a
        # visitor may already have written a login attempt and a security event;
        # those are expected and excluded. Any member, session, charge or report
        # is not, and fails the run.
        run: |
          npm run db:reset:academy -- --verify
          {
            echo "### Academy emptied"
            echo
            echo "Only the platform owner remains. It keeps its password and PIN and"
            echo "must enrol a new authenticator on the next sign-in."
            echo
            echo "The head coach is now created through the one-time secure setup."
          } >> "$GITHUB_STEP_SUMMARY"
