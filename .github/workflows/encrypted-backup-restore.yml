name: Encrypted backup restore verification

# Monthly: fetch the newest nightly backup from the private store, decrypt it,
# check it and start the site on it. See encrypted-production-backup.yml.

on:
  schedule:
    # First day of each month at 10:17 India Standard Time.
    - cron: "47 4 1 * *"
  workflow_dispatch:
    inputs:
      backup_name:
        description: Optional stored backup to check, for example smba-backup-2026-11-13T21-17-04-512Z (leave empty for the newest)
        required: false
        type: string

concurrency:
  group: encrypted-backup-restore-verification
  cancel-in-progress: false

permissions:
  contents: read

env:
  BETTER_AUTH_SECRET: smba-restore-only-secret-never-used-in-production-2026
  NEXT_PUBLIC_SMBA_SITE_ORIGIN: https://ci.smbaacademy.in
  SMBA_AUTH_MAIL_TRANSPORT: memory
  SMBA_REQUIRE_COACH_TOTP: "false"
  SMBA_REQUIRE_RECOVERY_EMAIL: "false"

jobs:
  restore:
    name: Restore and boot stored snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out trusted default-branch verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Fetch the newest stored backup
        id: backup
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_BACKUP: ${{ inputs.backup_name }}
          STORE_REPOSITORY: ${{ vars.SMBA_BACKUP_STORE_REPOSITORY || format('{0}/smba-backups', github.repository_owner) }}
          STORE_TOKEN_SET: ${{ secrets.SMBA_BACKUP_STORE_TOKEN != '' }}
        with:
          github-token: ${{ secrets.SMBA_BACKUP_STORE_TOKEN || github.token }}
          script: |
            const path = require("node:path")
            const backupStore = require("./.github/scripts/backup-store.js")
            try {
              backupStore.requireStoreToken(process.env.STORE_TOKEN_SET === "true")
              const store = backupStore.parseStoreRepository(process.env.STORE_REPOSITORY)
              await backupStore.assertPrivateStore({
                github,
                publicRepository: `${context.repo.owner}/${context.repo.repo}`,
                store,
              })
              const selected = backupStore.selectBackup(
                await backupStore.listStoredBackups({ github, store }),
                process.env.REQUESTED_BACKUP,
              )
              await backupStore.downloadStoredBackup({
                backup: selected,
                directory: path.join(process.env.RUNNER_TEMP, "smba-backup-download"),
                github,
                store,
              })
              core.setOutput("name", selected.name)
              core.setOutput("created-at", selected.createdAt)
            } catch (error) {
              await core.summary
                .addHeading("No backup could be checked", 3)
                .addRaw(error.message)
                .write()
              core.setFailed(error.message)
            }

      - name: Create isolated restore workspace
        id: workspace
        run: |
          restore_directory="$(mktemp -d "${RUNNER_TEMP}/smba-restore-XXXXXX")"
          chmod 700 "$restore_directory"
          mapfile -t encrypted_files < <(find "${RUNNER_TEMP}/smba-backup-download" -type f -name '*.gpg' -print)
          test "${#encrypted_files[@]}" -eq 1
          test "$(find "${RUNNER_TEMP}/smba-backup-download" -type f | wc -l)" -eq 1
          echo "directory=$restore_directory" >> "$GITHUB_OUTPUT"
          echo "encrypted=${encrypted_files[0]}" >> "$GITHUB_OUTPUT"
          echo "result=${RUNNER_TEMP}/smba-restore-result-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" >> "$GITHUB_OUTPUT"

      # Paths reach this shell through env, not ${{ }}: it holds the passphrase.
      - name: Decrypt, inspect and verify stored snapshot
        id: restore
        env:
          ENCRYPTED_PATH: ${{ steps.workspace.outputs.encrypted }}
          RESTORE_DIRECTORY: ${{ steps.workspace.outputs.directory }}
          RESULT_PATH: ${{ steps.workspace.outputs.result }}
          SMBA_BACKUP_PASSPHRASE: ${{ secrets.SMBA_BACKUP_PASSPHRASE }}
        run: |
          test "${#SMBA_BACKUP_PASSPHRASE}" -ge 24 || { echo "The backup passphrase is unavailable."; exit 1; }
          node scripts/operations/restore-backup-artifact.mjs \
            "$ENCRYPTED_PATH" \
            "$RESTORE_DIRECTORY" \
            "$RESULT_PATH"
          node - <<'NODE'
          const fs = require("node:fs")
          const result = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, "utf8"))
          const lines = [
            `ciphertext-sha256=${result.ciphertextSha256}`,
            `manifest-path=${result.manifestPath}`,
            `snapshot-path=${result.snapshotPath}`,
            `snapshot-sha256=${result.snapshotSha256}`,
          ]
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${lines.join("\n")}\n`)
          NODE

      - name: Copy restored database and apply current migrations
        env:
          DB_FILE_NAME: ${{ steps.workspace.outputs.directory }}/restored-migrated.db
          SNAPSHOT_PATH: ${{ steps.restore.outputs.snapshot-path }}
        run: |
          cp "$SNAPSHOT_PATH" "$DB_FILE_NAME"
          chmod 600 "$DB_FILE_NAME"
          npm run db:migrate
          node scripts/operations/verify-local-database-health.mjs "$DB_FILE_NAME"

      - name: Build against a separate empty disposable database
        env:
          DB_FILE_NAME: ${{ steps.workspace.outputs.directory }}/build-empty.db
        run: |
          npm run db:prepare:empty
          npm run build

      - name: Start the application against the restored copy
        env:
          BETTER_AUTH_SECURE_COOKIES: "false"
          DB_FILE_NAME: ${{ steps.workspace.outputs.directory }}/restored-migrated.db
        run: |
          npx next start -p 3103 > "${RUNNER_TEMP}/smba-restore-server.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/smba-restore-server.pid"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3103/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Smoke restored health and login
        run: node scripts/operations/check-restored-app.mjs http://127.0.0.1:3103

      - name: Write sanitized restore summary
        if: success()
        env:
          BACKUP_CREATED_AT: ${{ steps.backup.outputs.created-at }}
          BACKUP_NAME: ${{ steps.backup.outputs.name }}
          CIPHERTEXT_SHA256: ${{ steps.restore.outputs.ciphertext-sha256 }}
          SNAPSHOT_SHA256: ${{ steps.restore.outputs.snapshot-sha256 }}
        run: |
          {
            echo "## Encrypted backup restore verification"
            echo
            echo "- Result: passed"
            echo "- Backup: ${BACKUP_NAME}"
            echo "- Backup made: ${BACKUP_CREATED_AT}"
            echo "- Ciphertext SHA-256: \`${CIPHERTEXT_SHA256}\`"
            echo "- Snapshot SHA-256: \`${SNAPSHOT_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove all restored plaintext and stop the server
        if: always()
        env:
          RESTORE_DIRECTORY: ${{ steps.workspace.outputs.directory }}
          RESULT_PATH: ${{ steps.workspace.outputs.result }}
        run: |
          if test -f "${RUNNER_TEMP}/smba-restore-server.pid"; then
            kill "$(cat "${RUNNER_TEMP}/smba-restore-server.pid")" 2>/dev/null || true
          fi
          if test -n "$RESTORE_DIRECTORY" && test -d "$RESTORE_DIRECTORY"; then
            node scripts/operations/cleanup-restore-workspace.mjs "$RESTORE_DIRECTORY"
          fi
          rm -rf "${RUNNER_TEMP}/smba-backup-download"
          rm -f "$RESULT_PATH" "${RUNNER_TEMP}/smba-restore-server.log" "${RUNNER_TEMP}/smba-restore-server.pid"
