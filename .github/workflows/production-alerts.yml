name: Production alerts

on:
  workflow_dispatch:
    inputs:
      status:
        description: Open or resolve the harmless alert-delivery test issue
        required: true
        type: choice
        options:
          - open
          - resolved
  workflow_run:
    workflows:
      - Encrypted production backup
      - Operations monitor
      - Production health
      - Quality gate
      - UI accessibility
      - Encrypted backup restore verification
    types: [completed]
  deployment_status:

concurrency:
  group: production-alert-${{ github.event_name }}-${{ github.event.workflow_run.name || github.event.deployment.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  workflow-result:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped'
    name: Deliver workflow alert
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out alert helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Synchronize workflow alert
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const syncAlert = require("./.github/scripts/sync-production-alert.js")
            const run = context.payload.workflow_run
            await syncAlert({
              core,
              detailsUrl: run.html_url,
              github,
              key: run.name,
              owner: context.repo.owner,
              repo: context.repo.repo,
              status: run.conclusion === "success" ? "resolved" : "open",
              summary: `${run.name} completed with status: ${run.conclusion}.`,
            })

  deployment-result:
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment.environment == 'Production' &&
      github.event.deployment.creator.login == 'vercel[bot]' &&
      github.event.deployment.task == 'deploy' &&
      contains(fromJSON('["success","failure","error"]'), github.event.deployment_status.state)
    name: Validate and smoke production deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out alert helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Classify trusted production deployment
        id: deployment
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const classify = require("./.github/scripts/classify-production-deployment.js")
            const classification = await classify({
              deployment: context.payload.deployment,
              deploymentStatus: context.payload.deployment_status,
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            core.notice(classification.reason)
            core.setOutput("should-smoke", classification.shouldSmoke ? "true" : "false")
            core.setOutput("state", classification.state || "ignored")
            core.setOutput("trusted", classification.trusted ? "true" : "false")

      - name: Synchronize production deployment alert
        if: steps.deployment.outputs.trusted == 'true'
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const deployment = context.payload.deployment
            const deploymentStatus = context.payload.deployment_status
            const syncAlert = require("./.github/scripts/sync-production-alert.js")
            await syncAlert({
              core,
              detailsUrl: deploymentStatus.target_url || deploymentStatus.log_url,
              github,
              key: "Production deployment",
              owner: context.repo.owner,
              repo: context.repo.repo,
              status: deploymentStatus.state === "success" ? "resolved" : "open",
              summary: `The production deployment for ${deployment.ref} reported: ${deploymentStatus.state}.`,
            })

      - name: Use Node.js 22 for immediate smoke
        if: steps.deployment.outputs.should-smoke == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify canonical production without signing in
        id: smoke
        if: steps.deployment.outputs.should-smoke == 'true'
        continue-on-error: true
        run: node scripts/operations/check-production.mjs https://smbaacademy.in --attempts 12 --delay-ms 10000

      - name: Synchronize immediate production health
        if: always() && steps.deployment.outputs.should-smoke == 'true'
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const syncAlert = require("./.github/scripts/sync-production-alert.js")
            const healthy = "${{ steps.smoke.outcome }}" === "success"
            await syncAlert({
              core,
              detailsUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              github,
              key: "Production health",
              owner: context.repo.owner,
              repo: context.repo.repo,
              status: healthy ? "resolved" : "open",
              summary: healthy
                ? "The canonical production smoke passed after deployment."
                : "The canonical production smoke failed after deployment.",
            })

      - name: Require immediate production smoke
        if: always() && steps.deployment.outputs.should-smoke == 'true'
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: test "$SMOKE_OUTCOME" = success

  manual-delivery-test:
    if: github.event_name == 'workflow_dispatch'
    name: Test alert delivery
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out alert helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Synchronize harmless test alert
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const syncAlert = require("./.github/scripts/sync-production-alert.js")
            await syncAlert({
              core,
              detailsUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              github,
              key: "Alert delivery test",
              owner: context.repo.owner,
              repo: context.repo.repo,
              status: "${{ inputs.status }}",
              summary: "This is a harmless manual test of production alert delivery.",
            })
