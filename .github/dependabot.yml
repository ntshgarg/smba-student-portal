version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    # @types/node describes the Node runtime this project actually executes on,
    # which the workflows pin to 22. A major bump would let code typecheck
    # against APIs that do not exist at runtime, so the types move with a
    # deliberate runtime upgrade rather than on their own schedule.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # vitest is the test runner for 156 files and 823 tests, and it ships to
      # nobody. A major is a deliberate migration with real regression surface
      # and no operational payoff on its own schedule, so it moves when someone
      # chooses to do that work rather than every time upstream releases.
      - dependency-name: "vitest"
        update-types:
          - version-update:semver-major
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
